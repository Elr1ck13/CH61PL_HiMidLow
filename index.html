<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/main.css">
    <h1 class="text-center">Bienvenidos a ordenador de Numeros</h1>
    <h3></h3>

    <div class="numform">
        <form>
            <legend>Por favor ingresa 3 numeros en los siguientes recuadros</legend>
            <div class="form-group">
                <label for="number1">Numero 1</label>
                <input type="number" class="form-control" id="number1" aria-describedby="num1"
                    placeholder="Ingrese numero">
               
            </div>
            <div class="form-group">

                <label for="number2">Numero 2</label>
                <input type="number" class="form-control" id="number2" aria-describedby="num2"
                    placeholder="Ingrese numero">
                
            </div>
            <div class="form-group">

                <label for="number3">Numero 3</label>
                <input type="number" class="form-control" id="number3" aria-describedby="num3"
                    placeholder="Ingrese numero">
                <small id="num3" class="form-text text-muted">Favor de solo ingresar números</small>
            </div>

            <button type="submit" class="btn btn-primary">Ordenar</button>
        </form>


    </div>

    <div >
        <p id="showResult"></p>
    </div>


</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="./js/main.js"></script>

</body>

</html>
